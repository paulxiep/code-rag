[package]
name = "code-raptor"
version = "0.1.0"
authors = ["paulxiep"]
edition = "2024"

# Code Raptor — the topology engine. Reads persisted relation edges
# (`call_edges` / `graph_edges`) written by `code-rag-ingest` and derives
# architectural structure from them: RelationGraph build, community detection
# (Leiden / Louvain), betweenness + cohesion + dependency cycles, ClusterChunk
# summaries, architecture report + viz/exports. Native only (heavy + parallel
# algorithms never enter the wasm path). SoC: ingestion *writes* edges, topology
# *reads* them — this crate does NOT depend on `code-rag-ingest`.

[dependencies]
code-rag-types = { path = "../code-rag-types" }
code-rag-store = { path = "../code-rag-store" }

# In-memory topology + graph algorithms (community detection, betweenness,
# cycles land here in R2–R4).
petgraph = "0.6"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"

# Async (topology stage runs after ingest, reads LanceDB)
tokio = { version = "1.48", features = ["full"] }

[dev-dependencies]
tempfile = "3.13"
